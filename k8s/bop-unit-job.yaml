apiVersion: batch/v1
kind: Job
metadata:
  name: scarab-bop-unit
  namespace: ucsc-hsc
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      containers:
      - name: bop-unit
        image: ubuntu:focal
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          echo "=== Install unit-test dependencies ==="
          apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::ForceIPv4=true
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::ForceIPv4=true \
            git gcc libc6-dev

          echo "=== Clone BOP branch ==="
          cd /root
          git clone --branch bop-prefetcher https://github.com/labyrinth-ssr/scarab.git
          cd /root/scarab
          git rev-parse --short HEAD

          echo "=== Compile BOP unit harness ==="
          gcc -std=gnu11 -Wall -Wextra -Isrc tests/prefetcher/bop_unit_test.c -o /tmp/bop_unit_test

          echo "=== Run BOP unit harness ==="
          /tmp/bop_unit_test
          echo "=== BOP UNIT TEST PASSED ==="
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1Gi"
